<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Messages Vocaux</title>
    <style>
      .initial-loading {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        color: #1f2933;
        background: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
        text-align: center;
        padding: 2rem;
      }

      .initial-loading__spinner {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        border: 4px solid rgba(59, 130, 246, 0.2);
        border-top-color: rgba(59, 130, 246, 0.85);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="initial-loading">
        <strong>JavaScript requis</strong>
        <p>Activez JavaScript pour charger l'application de gestion des messages vocaux.</p>
      </div>
    </noscript>
    <div id="root">
      <div class="initial-loading" aria-live="polite" role="status">
        <div class="initial-loading__spinner" aria-hidden="true"></div>
        <p>Chargement de l'application...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
