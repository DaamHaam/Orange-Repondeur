<!DOCTYPE html> 
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gestion des Messages Vocaux</title>

  <style>
    :root {
      --gap: 1rem;
      --card-padding: 0.75rem;
      --card-gap: 0.5rem;
      --border-radius: 8px;
      --button-size: 2.8rem;

      /* Couleurs Kinés (pour les backgrounds des selects) */
      --kine-justine-bg: #E4CCFC;
      --kine-charlotte-bg: #FAB88C;
      --kine-johan-bg: #8EFB8E;
      --kine-simon-bg: #8AC2F8;
      --kine-florianne-bg: #87C0C0;
      --kine-damien-bg: #C2FDFC;
      --kine-marine-bg: #BE8486;
      --kine-non-assigne-bg: #e0e0e0;

      /* Couleurs Kinés (pour les backgrounds des cartes) */
      --card-justine-bg: #F9F4FE;
      --card-charlotte-bg: #FEF0E8;
      --card-johan-bg: #E8FEE8;
      --card-simon-bg: #E7F2FD;
      --card-florianne-bg: #E7F2F2;
      --card-damien-bg: #F2FEFE;
      --card-marine-bg: #F2E6E6;
      --card-default-bg: #fff;

      /* Couleurs Types de Message */
      --type-rdv-vestib-bg: #ADD8E6; /* Bleu clair */
      --type-rdv-kine-bg: #90EE90;   /* Vert clair */
      --type-annulation-bg: #FF7F7F; /* Rouge vif */
      --type-autre-bg: #d3d3d3;      /* Gris clair */
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding-top: var(--gap);
      padding-bottom: var(--gap);
      color: #333;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
      justify-content: center;
      margin-bottom: var(--gap);
      padding: 0 0.5rem;
    }
    #filters select {
      padding: 0.5rem 0.8rem;
      border-radius: var(--border-radius);
      border: 1px solid #ccc;
      background-color: #fff;
      min-width: 150px;
    }

    #list {
      width: 92vw;
      margin: 0 auto;
      padding: 0 0.5rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .card {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--card-gap);
      background: var(--card-default-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      padding: var(--card-padding);
      box-sizing: border-box;
      transition: background-color 0.3s ease;
    }

    @media (min-width: 768px) {
      .card {
        grid-template-columns: 13rem 2fr auto;
      }
    }
     @media (min-width: 1024px) {
      .card {
        grid-template-columns: 14rem 2.5fr 10rem;
      }
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.9rem;
      color: #444;
    }
    .meta > div:not(select):not(:last-child) {
       margin-bottom: 0.1rem;
    }
    .meta .date, .meta .name, .meta .email {
      font-size: 0.95rem;
    }
    .meta .phone {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 1rem;
      font-weight: 500;
    }
    .meta .copy-icon {
      background: none;
      border: 0;
      cursor: pointer;
      width: 1.3rem;
      height: 1.3rem;
      padding: 0;
      color: #555;
    }
    .meta .copy-icon svg { width: 100%; height: 100%; }

    .meta select {
      width: 100%;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.85rem;
      margin-top: 0.2rem; 
      appearance: none;
      -webkit-appearance: none;
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 0.8em;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    }
     .meta select:first-of-type { 
        margin-top: auto;
    }

    .main-content {
      display: flex;
      flex-direction: column;
    }
    .transcript {
      line-height: 1.5;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      flex-grow: 1;
      color: #222;
    }
    .transcript strong { font-weight: 600; }

    .summary-line {
      font-size: 0.85rem;
      color: #555;
      background-color: #f9f9f9;
      padding: 0.5rem;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-top: auto;
    }
    .summary-line .text { flex-grow: 1; word-break: break-word; }
    .summary-line .copy-icon {
      background: none;
      border: 0;
      cursor: pointer;
      width: 1.3rem;
      height: 1.3rem;
      padding: 0;
      color: #555;
      flex-shrink: 0;
    }
    .summary-line .copy-icon svg { width: 100%; height: 100%; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
      justify-content: flex-start;
    }
    .actions .audio-controls {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        justify-content: space-around;
    }
    .actions button {
      all: unset;
      cursor: pointer;
      width: var(--button-size);
      height: var(--button-size);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background-color: #e9ecef;
      color: #333;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .actions button:hover { background-color: #ced4da; }
    .actions button:active { transform: scale(0.95); }
    .actions button.delete-btn {
      background-color: #ffdddd;
      color: #d9534f;
    }
    .actions button.delete-btn:hover { background-color: #f8caca; }
    .actions button svg { width: 60%; height: 60%; }

    .actions .progress-bar {
      width: 100%;
      -webkit-appearance: none; appearance: none;
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    .actions .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px;
      background: #007bff;
      border-radius: 50%;
      cursor: pointer;
    }
    .actions .progress-bar::-moz-range-thumb {
      width: 16px; height: 16px;
      background: #007bff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;
    }

    select.kine-Justine { background-color: var(--kine-justine-bg) !important; }
    select.kine-Charlotte { background-color: var(--kine-charlotte-bg) !important; }
    select.kine-Johan { background-color: var(--kine-johan-bg) !important; }
    select.kine-Simon { background-color: var(--kine-simon-bg) !important; }
    select.kine-Florianne { background-color: var(--kine-florianne-bg) !important; }
    select.kine-Damien { background-color: var(--kine-damien-bg) !important; }
    select.kine-Marine { background-color: var(--kine-marine-bg) !important; }
    select.kine-Non-assigne { background-color: var(--kine-non-assigne-bg) !important; }

    .card.card-kine-Justine { background-color: var(--card-justine-bg); }
    .card.card-kine-Charlotte { background-color: var(--card-charlotte-bg); }
    .card.card-kine-Johan { background-color: var(--card-johan-bg); }
    .card.card-kine-Simon { background-color: var(--card-simon-bg); }
    .card.card-kine-Florianne { background-color: var(--card-florianne-bg); }
    .card.card-kine-Damien { background-color: var(--card-damien-bg); }
    .card.card-kine-Marine { background-color: var(--card-marine-bg); }

    select.type-Demande-RDV-vestib { background-color: var(--type-rdv-vestib-bg) !important; }
    select.type-Demande-RDV-kine { background-color: var(--type-rdv-kine-bg) !important; }
    select.type-Annulation { background-color: var(--type-annulation-bg) !important; }
    select.type-Autre { background-color: var(--type-autre-bg) !important; }

    @media (max-width: 767px) {
      .card { grid-template-columns: 1fr; }
      .meta { order: 1; }
      .main-content { order: 2; }
      .actions {
        order: 3; flex-direction: row; flex-wrap: wrap;
        justify-content: space-between; align-items: center;
      }
      .actions .audio-controls { flex-grow: 1; justify-content: flex-start; }
      .actions .progress-bar { order: -1; margin-bottom: 0.5rem; }
      .actions .delete-btn { margin-left: auto; }
      #filters { flex-direction: column; align-items: stretch; }
      #filters select { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="filters">
    <select id="filter-kine"><option value="">Tous les kinés</option></select>
    <select id="filter-type"><option value="">Tous types</option></select>
  </div>
  <div id="list"></div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://xvxvhfpqyheelsdczxcj.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2eHZoZnBxeWhlZWxzZGN6eGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY5MDMzODUsImV4cCI6MjA2MjQ3OTM4NX0.Vj_0bATftrwhphgkPM3ii0DO4rSYp26Wy7TK30ZXzTY";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const KINES = ["Johan", "Damien", "Simon", "Justine", "Charlotte", "Florianne", "Marine"];
    const KINE_COLORS = {
        "Justine":   { select: "var(--kine-justine-bg)", card: "var(--card-justine-bg)" },
        "Charlotte": { select: "var(--kine-charlotte-bg)", card: "var(--card-charlotte-bg)" },
        "Johan":     { select: "var(--kine-johan-bg)", card: "var(--card-johan-bg)" },
        "Simon":     { select: "var(--kine-simon-bg)", card: "var(--card-simon-bg)" },
        "Florianne": { select: "var(--kine-florianne-bg)", card: "var(--card-florianne-bg)" },
        "Damien":    { select: "var(--kine-damien-bg)", card: "var(--card-damien-bg)" },
        "Marine":    { select: "var(--kine-marine-bg)", card: "var(--card-marine-bg)" },
        "Non assigné": { select: "var(--kine-non-assigne-bg)", card: "var(--card-default-bg)" }
    };

    const MESSAGE_TYPES = ["Demande RDV vestib", "Demande RDV kiné", "Annulation", "Autre"];
    const MESSAGE_TYPE_COLORS = {
        "Demande RDV vestib": "var(--type-rdv-vestib-bg)",
        "Demande RDV kiné": "var(--type-rdv-kine-bg)",
        "Annulation": "var(--type-annulation-bg)",
        "Autre": "var(--type-autre-bg)"
    };

    const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="sr-only">Lire</span>`;
    const ICON_PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span class="sr-only">Pause</span>`;
    const ICON_STOP = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg><span class="sr-only">Arrêter</span>`;
    const ICON_DELETE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span class="sr-only">Supprimer</span>`;
    const ICON_COPY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg><span class="sr-only">Copier</span>`;
    const ICON_COPIED = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span class="sr-only">Copié</span>`;
    const ICON_AUDIO_UNAVAILABLE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg><span class="sr-only">Audio indisponible</span>`;

    const listElement = document.getElementById('list');
    const filterKineElement = document.getElementById('filter-kine');
    const filterTypeElement = document.getElementById('filter-type');

    let allMessages = [];
    let currentAudio = null;
    let currentAudioCardData = null; 

    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      const date = new Date(dateString);
      return `${date.toLocaleDateString('fr-FR')} ${date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
    }

    function styleSelectByValue(selectElement, value, typeContext) {
        selectElement.className.split(' ').forEach(cls => {
            if (cls.startsWith('type-') || cls.startsWith('kine-')) {
                selectElement.classList.remove(cls);
            }
        });

        let color, classNamePrefix, baseValue;
        if (typeContext === 'kine') {
            baseValue = value || "Non assigné";
            color = KINE_COLORS[baseValue]?.select;
            classNamePrefix = 'kine-';
        } else if (typeContext === 'messageType') {
            baseValue = value || "Autre";
            color = MESSAGE_TYPE_COLORS[baseValue];
            classNamePrefix = 'type-';
        }
        
        if (color) {
            selectElement.style.backgroundColor = color;
            const sanitizedValue = baseValue.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '');
            if (sanitizedValue) {
                selectElement.classList.add(`${classNamePrefix}${sanitizedValue}`);
            }
        } else {
            selectElement.style.backgroundColor = ''; 
        }
    }
    
    function styleCardByKine(cardElement, kineName) {
        cardElement.className.split(' ').forEach(cls => {
            if (cls.startsWith('card-kine-')) {
                cardElement.classList.remove(cls);
            }
        });

        const kineKey = kineName || "Non assigné";
        const kineClassSuffix = (kineKey !== "Non assigné") 
            ? kineKey.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '')
            : null;

        if (kineClassSuffix) {
             cardElement.classList.add(`card-kine-${kineClassSuffix}`);
        } else {
             cardElement.style.backgroundColor = KINE_COLORS["Non assigné"].card;
        }
    }

    async function copyToClipboard(text, buttonElement) {
      try {
        await navigator.clipboard.writeText(text);
        const originalIcon = buttonElement.innerHTML;
        buttonElement.innerHTML = ICON_COPIED;
        setTimeout(() => { buttonElement.innerHTML = originalIcon; }, 1500);
      } catch (err) {
        console.error('Failed to copy: ', err);
        alert('Erreur lors de la copie.');
      }
    }

    function createMessageCard(message) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = message.id;
      styleCardByKine(card, message.prenom_kine);

      const meta = document.createElement('div');
      meta.className = 'meta';

      const dateDiv = document.createElement('div');
      dateDiv.className = 'date';
      dateDiv.textContent = formatDate(message.date);
      meta.appendChild(dateDiv);

      const phoneDiv = document.createElement('div');
      phoneDiv.className = 'phone';
      const phoneSpan = document.createElement('span');
      phoneSpan.textContent = message.phone;
      phoneDiv.appendChild(phoneSpan);
      const copyPhoneBtn = document.createElement('button');
      copyPhoneBtn.className = 'copy-icon';
      copyPhoneBtn.title = "Copier numéro";
      copyPhoneBtn.innerHTML = ICON_COPY;
      copyPhoneBtn.onclick = () => copyToClipboard(message.phone, copyPhoneBtn);
      phoneDiv.appendChild(copyPhoneBtn);
      meta.appendChild(phoneDiv);

      if (message.name) {
        const nameDiv = document.createElement('div');
        nameDiv.className = 'name';
        nameDiv.textContent = message.name;
        meta.appendChild(nameDiv);
      }
      if (message.email) {
        const emailDiv = document.createElement('div');
        emailDiv.className = 'email';
        emailDiv.textContent = message.email;
        meta.appendChild(emailDiv);
      }
            
      const kineSelect = document.createElement('select');
      kineSelect.className = 'select-kine';
      const defaultKineOption = document.createElement('option');
      defaultKineOption.value = "";
      defaultKineOption.textContent = "Kiné non assigné";
      kineSelect.appendChild(defaultKineOption);
      KINES.forEach(kine => {
        const option = document.createElement('option');
        option.value = kine;
        option.textContent = kine;
        kineSelect.appendChild(option);
      });
      kineSelect.value = message.prenom_kine || "";
      styleSelectByValue(kineSelect, kineSelect.value, 'kine');
      kineSelect.onchange = async (e) => {
        const newKine = e.target.value || null; 
        const { error } = await supabase.from('messages').update({ prenom_kine: newKine }).eq('id', message.id);
        if (error) {
          console.error("Erreur MAJ kiné:", error);
          alert(`Erreur mise à jour kiné: ${error.message}`);
          e.target.value = message.prenom_kine || ""; 
        } else {
          message.prenom_kine = newKine;
          styleSelectByValue(kineSelect, newKine, 'kine');
          styleCardByKine(card, newKine);
        }
      };
      meta.appendChild(kineSelect); 

      const typeSelect = document.createElement('select');
      typeSelect.className = 'select-type';
      MESSAGE_TYPES.forEach(type => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        if (type === "Autre" && !message.message_type) { 
             option.selected = true;
        } else if (message.message_type === type) {
            option.selected = true;
        }
        typeSelect.appendChild(option);
      });
      typeSelect.value = message.message_type || "Autre"; 
      styleSelectByValue(typeSelect, typeSelect.value, 'messageType');
      typeSelect.onchange = async (e) => {
        const newType = e.target.value;
        const { error } = await supabase.from('messages').update({ message_type: newType }).eq('id', message.id);
        if (error) {
          console.error("Erreur MAJ type:", error);
          alert(`Erreur mise à jour type: ${error.message}`);
          e.target.value = message.message_type || "Autre"; 
        } else {
          message.message_type = newType;
          styleSelectByValue(typeSelect, newType, 'messageType');
        }
      };
      meta.appendChild(typeSelect); 
      card.appendChild(meta);

      const mainContent = document.createElement('div');
      mainContent.className = 'main-content';
      const transcriptDiv = document.createElement('div');
      transcriptDiv.className = 'transcript';
      transcriptDiv.innerHTML = message.transcript ? message.transcript.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') : '<em>Pas de transcription.</em>';
      mainContent.appendChild(transcriptDiv);
      const summaryLine = document.createElement('div');
      summaryLine.className = 'summary-line';
      const summaryText = document.createElement('span');
      summaryText.className = 'text';
      let summaryContent = message.phone;
      if (message.name) summaryContent += ` ${message.name}`;
      summaryContent += ` – ${message.resume || 'Pas de résumé.'}`;
      summaryText.textContent = summaryContent;
      summaryLine.appendChild(summaryText);
      const copySummaryBtn = document.createElement('button');
      copySummaryBtn.className = 'copy-icon';
      copySummaryBtn.title = "Copier infos + résumé";
      copySummaryBtn.innerHTML = ICON_COPY;
      copySummaryBtn.onclick = () => copyToClipboard(summaryText.textContent, copySummaryBtn);
      summaryLine.appendChild(copySummaryBtn);
      mainContent.appendChild(summaryLine);
      card.appendChild(mainContent);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const audioControlsDiv = document.createElement('div');
      audioControlsDiv.className = 'audio-controls';
      const playPauseBtn = document.createElement('button');
      playPauseBtn.innerHTML = message.audio_path ? ICON_PLAY : ICON_AUDIO_UNAVAILABLE;
      playPauseBtn.title = message.audio_path ? "Lire/Pause" : "Audio indisponible";
      if (!message.audio_path) playPauseBtn.disabled = true;
      const stopBtn = document.createElement('button');
      stopBtn.innerHTML = ICON_STOP;
      stopBtn.title = "Arrêter";
      if (!message.audio_path) stopBtn.disabled = true;
      audioControlsDiv.appendChild(playPauseBtn);
      audioControlsDiv.appendChild(stopBtn);
      actions.appendChild(audioControlsDiv);
      const progressBar = document.createElement('input');
      progressBar.type = 'range';
      progressBar.className = 'progress-bar';
      progressBar.value = 0;
      progressBar.max = 100;
      if (!message.audio_path) progressBar.disabled = true;
      actions.appendChild(progressBar);
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.innerHTML = ICON_DELETE;
      deleteBtn.title = "Supprimer message";
      
      deleteBtn.onclick = async () => {
        const messageIdToDelete = message.id;
        const audioPathToDelete = message.audio_path; // Peut être null

        console.log(`Tentative de suppression du message ID: ${messageIdToDelete}`);
        if (audioPathToDelete) {
            console.log(`Avec audio_path: ${audioPathToDelete}`);
        }

        try {
          const { error: dbError } = await supabase
            .from('messages')
            .delete()
            .eq('id', messageIdToDelete);

          if (dbError) {
            console.error("Erreur suppression DB:", dbError);
            throw new Error(`Échec de la suppression du message (ID: ${messageIdToDelete}) de la base de données: ${dbError.message}`);
          }

          console.log(`Message ID ${messageIdToDelete} supprimé de la DB avec succès.`);
          card.remove(); 
          allMessages = allMessages.filter(m => m.id !== messageIdToDelete); 

          if (audioPathToDelete) {
            // ***** MODIFICATION ICI : ajout de .trim() *****
            const rawKey = audioPathToDelete.trim().replace(/^\/?audio-files\//, "");
            console.log(`Tentative de suppression du fichier audio avec rawKey: '${rawKey}' (bucket 'audio-files')`);

            if (rawKey) { // Vérifier que rawKey n'est pas une chaîne vide après trim/replace
              const { data: removeData, error: storageError } = await supabase
                .storage
                .from('audio-files') // Assurez-vous que 'audio-files' est le nom exact de votre bucket
                .remove([rawKey]);   // remove() attend un tableau de chemins

              if (storageError) {
                // Si une erreur est retournée, elle sera loggée ici.
                console.error(`ERREUR lors de la suppression du fichier audio '${rawKey}':`, storageError);
                alert(`Le message a été supprimé de la base de données, mais une ERREUR est survenue lors de la tentative de suppression du fichier audio associé: ${storageError.message}.\nVérifiez la console et vos politiques RLS sur le bucket 'audio-files'.`);
              } else {
                // Si Supabase ne retourne PAS d'erreur, cela signifie qu'il considère l'opération comme réussie
                // (soit fichier supprimé, soit fichier non trouvé, ce qui n'est pas une erreur pour remove()).
                console.log(`Supabase API call pour supprimer '${rawKey}' terminée. Réponse data:`, removeData);
                // À ce stade, si le fichier est toujours là, c'est très probablement RLS ou un chemin incorrect
                // que Supabase ne considère pas comme une erreur pour .remove().
              }
            } else {
                console.warn(`rawKey est vide pour audio_path '${audioPathToDelete}' après nettoyage. Suppression du fichier audio ignorée.`);
            }
          } else {
            console.log("Aucun audio_path associé à ce message, suppression de fichier ignorée.");
          }
        } catch (error) {
          console.error(`Erreur globale lors de la suppression du message ID ${messageIdToDelete}:`, error);
          alert(`Erreur lors de la suppression : ${error.message}\nLe message n'a peut-être pas été supprimé. Veuillez vérifier la console et actualiser.`);
        }
      };
      actions.appendChild(deleteBtn);
      card.appendChild(actions);

      let audioForThisCard = null;
      if (message.audio_path) {
        playPauseBtn.onclick = async () => {
          if (currentAudio && currentAudio !== audioForThisCard) {
            currentAudio.pause();
            if (currentAudioCardData && currentAudioCardData.playPauseBtn) {
                currentAudioCardData.playPauseBtn.innerHTML = ICON_PLAY;
                currentAudioCardData.progressBar.value = currentAudioCardData.audio.currentTime; // Garder la position
            }
          }

          if (!audioForThisCard) {
            const rawKey = message.audio_path.trim().replace(/^\/?audio-files\//, "");
            const { data, error } = supabase.storage.from('audio-files').getPublicUrl(rawKey);
            if (error || !data.publicUrl) {
              console.error("Erreur getPublicUrl:", error);
              playPauseBtn.innerHTML = ICON_AUDIO_UNAVAILABLE; playPauseBtn.disabled = true;
              stopBtn.disabled = true; progressBar.disabled = true;
              alert("Impossible de charger l'audio."); return;
            }
            audioForThisCard = new Audio(data.publicUrl);
            currentAudio = audioForThisCard;
            currentAudioCardData = { playPauseBtn, progressBar, audio: audioForThisCard };

            audioForThisCard.onloadedmetadata = () => { progressBar.max = audioForThisCard.duration; };
            audioForThisCard.ontimeupdate = () => { progressBar.value = audioForThisCard.currentTime; };
            audioForThisCard.onended = () => {
              playPauseBtn.innerHTML = ICON_PLAY;
              if (currentAudio === audioForThisCard) { 
                  currentAudio = null; currentAudioCardData = null;
              }
            };
            audioForThisCard.onerror = (e) => {
                console.error("Erreur de l'élément Audio:", e);
                playPauseBtn.innerHTML = ICON_AUDIO_UNAVAILABLE; playPauseBtn.disabled = true;
                stopBtn.disabled = true; progressBar.disabled = true;
                alert("Erreur de lecture audio.");
                if (currentAudio === audioForThisCard) {
                    currentAudio = null; currentAudioCardData = null;
                }
            };
          } else {
             currentAudio = audioForThisCard; 
             currentAudioCardData = { playPauseBtn, progressBar, audio: audioForThisCard };
          }
          
          if (audioForThisCard.paused) {
            try {
                await audioForThisCard.play();
                playPauseBtn.innerHTML = ICON_PAUSE;
            } catch (e) {
                console.error("Erreur au play():", e);
                playPauseBtn.innerHTML = ICON_PLAY;
                alert("Erreur de lecture audio.");
            }
          } else {
            audioForThisCard.pause();
            playPauseBtn.innerHTML = ICON_PLAY;
          }
        };

        stopBtn.onclick = () => {
          if (audioForThisCard) {
            audioForThisCard.pause();
            audioForThisCard.currentTime = 0;
            playPauseBtn.innerHTML = ICON_PLAY;
            progressBar.value = 0;
            if (currentAudio === audioForThisCard) {
                currentAudio = null; currentAudioCardData = null;
            }
          }
        };
        progressBar.oninput = () => { if (audioForThisCard) audioForThisCard.currentTime = progressBar.value; };
      }
      return card;
    }

    function renderMessages(messagesToRender) {
      listElement.innerHTML = '';
      const sortedMessages = messagesToRender.sort((a, b) => new Date(b.date) - new Date(a.date));
      sortedMessages.forEach(message => {
        listElement.appendChild(createMessageCard(message));
      });
    }

    async function fetchAndRenderMessages() {
      listElement.innerHTML = "<p>Chargement des messages...</p>";
      try {
        let { data: messages, error } = await supabase.from('messages').select('*').order('date', { ascending: false });
        if (error) throw error;
        allMessages = messages || [];
        if(allMessages.length === 0) {
            listElement.innerHTML = "<p>Aucun message pour le moment.</p>";
        } else {
            filterAndRenderMessages();
        }
      } catch (e) {
        console.error("Erreur chargement messages:", e);
        listElement.innerHTML = `<p>Erreur de chargement des messages: ${e.message}</p>`;
      }
    }
    
    function filterAndRenderMessages() {
        const kineFilter = filterKineElement.value;
        const typeFilter = filterTypeElement.value;
        let filteredMessages = allMessages;

        if (kineFilter) {
            filteredMessages = filteredMessages.filter(m => (kineFilter === "Non assigné") ? !m.prenom_kine : m.prenom_kine === kineFilter);
        }
        if (typeFilter) {
            filteredMessages = filteredMessages.filter(m => m.message_type === typeFilter);
        }
        
        if(filteredMessages.length === 0 && allMessages.length > 0) {
             listElement.innerHTML = "<p>Aucun message ne correspond à vos filtres.</p>";
        } else if (filteredMessages.length === 0 && allMessages.length === 0) {
             listElement.innerHTML = "<p>Aucun message pour le moment.</p>";
        }
        else {
            renderMessages(filteredMessages);
        }
    }

    function populateFilters() {
      KINES.forEach(kine => {
        const option = document.createElement('option');
        option.value = kine; option.textContent = kine;
        filterKineElement.appendChild(option);
      });
       const nonAssigneOption = document.createElement('option');
       nonAssigneOption.value = "Non assigné"; nonAssigneOption.textContent = "Kiné non assigné";
       filterKineElement.appendChild(nonAssigneOption);

      MESSAGE_TYPES.forEach(type => {
        const option = document.createElement('option');
        option.value = type; option.textContent = type;
        filterTypeElement.appendChild(option);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      populateFilters();
      fetchAndRenderMessages();
      filterKineElement.addEventListener('change', filterAndRenderMessages);
      filterTypeElement.addEventListener('change', filterAndRenderMessages);
    });
  </script>
</body>
</html>
