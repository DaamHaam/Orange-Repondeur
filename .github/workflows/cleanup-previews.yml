name: Cleanup PR previews

on:
  pull_request:
    types: [closed]
    branches: [ main, Next ]

permissions:
  contents: write

jobs:
  clean-next:
    if: github.base_ref == 'Next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: |
          rm -rf beta/pr-${{ github.event.number }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: cleanup preview for PR #${{ github.event.number }} (base=Next)"
            git push
          fi

  clean-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: |
          rm -rf pr-${{ github.event.number }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: cleanup preview for PR #${{ github.event.number }} (base=main)"
            git push
          fi
