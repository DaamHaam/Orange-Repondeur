name: Pages (prod, beta, PR previews)

on:
  push:
    branches: [ main, Next ]
  pull_request:
    branches: [ main, Next ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # push sur gh-pages
  pull-requests: write   # commenter l'URL de preview

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref || format('pr-{0}', github.event.number) }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REPO_SLUG: 'Orange-Repondeur'   # ⚠️ Assure-toi que le slug correspond exactement au nom du repo

jobs:
  # --- PROD: push sur main -> racine de gh-pages ---
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (prod)
        # Si ton Vite lit VITE_BASE, on lui injecte la base prod.
        # Si ton Vite est en base './', cette variable sera simplement ignorée.
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/
        run: npm run build

      - name: Déployer production (racine gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          # On garde les autres dossiers (beta/, beta/pr-*/). On écrase seulement les fichiers de la racine.
          keep_files: true

  # --- BETA: push sur Next -> gh-pages/beta ---
  deploy-beta:
    if: github.ref == 'refs/heads/Next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (beta)
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/beta/
        run: npm run build

      - name: Déployer beta (gh-pages/beta)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: beta
          keep_files: true   # on préserve les autres dossiers (pr-*)

  # --- PREVIEW PR vers Next: gh-pages/beta/pr-<num>/ ---
  pr-preview-next:
    if: github.event_name == 'pull_request' && github.base_ref == 'Next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (PR preview Next)
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/
        run: npm run build

      - name: Déployer PR preview (Next)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: beta/pr-${{ github.event.number }}
          keep_files: true   # on n'efface pas les autres previews

      - name: Commenter l'URL de preview (Next)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            🚀 Préversion déployée :
            https://${{ github.repository_owner }}.github.io/${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/

  # --- PREVIEW PR vers main: gh-pages/beta/pr-<num>/ (même dossier que pour Next) ---
  pr-preview-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (PR preview main)
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/
        run: npm run build

      - name: Déployer PR preview (main)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: beta/pr-${{ github.event.number }}
          keep_files: true

      - name: Commenter l'URL de preview (main)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            🚀 Préversion déployée :
            https://${{ github.repository_owner }}.github.io/${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/
