name: Pages (prod, beta, PR previews)

on:
  push:
    branches: [ main, Next ]
  pull_request:
    # On veut des préviews pour les PR vers main ET vers Next
    branches: [ main, Next ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # nécessaire pour push sur gh-pages
  pull-requests: write   # nécessaire pour commenter l'URL de preview

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref || format('pr-{0}', github.event.number) }}
  cancel-in-progress: true

jobs:
  # --- PROD: push sur main -> racine de gh-pages ---
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (prod)
        run: npm run build

      - name: Deploy production to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true        # NE PAS effacer /beta ni /pr-*

  # --- BETA: push sur Next -> gh-pages/beta ---
  deploy-beta:
    if: github.ref == 'refs/heads/Next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (beta)
        run: npm run build

      - name: Deploy beta to gh-pages/beta
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: beta
          keep_files: true

  # --- PR PREVIEW vers Next: gh-pages/beta/pr-<num>/ ---
  pr-preview-next:
    if: github.event_name == 'pull_request' && github.base_ref == 'Next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (PR preview Next)
        run: npm run build

      - name: Deploy PR preview (Next)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: beta/pr-${{ github.event.number }}
          keep_files: true

      - name: Compute repo vars
        run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Comment preview URL (Next)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            🚀 Préversion déployée :
            https://${{ github.repository_owner }}.github.io/${{ env.REPO_NAME }}/beta/pr-${{ github.event.number }}/

  # --- PR PREVIEW vers main: gh-pages/beta/pr-<num>/ ---
  pr-preview-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build (PR preview main)
        run: npm run build

      - name: Deploy PR preview (main)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: beta/pr-${{ github.event.number }}
          keep_files: true

      - name: Compute repo vars
        run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Comment preview URL (main)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            🚀 Préversion déployée :
            https://${{ github.repository_owner }}.github.io/${{ env.REPO_NAME }}/beta/pr-${{ github.event.number }}/
