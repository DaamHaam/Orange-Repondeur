name: Pages (prod, beta, PR previews)

on:
  push:
    branches: [ main, Next ]
  pull_request:
    branches: [ main, Next ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# concurrency:
 #  group: pages-${{ github.workflow }}-${{ github.ref || format('pr-{0}', github.event.number) }}
  # cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REPO_SLUG: 'Orange-Repondeur'   # ⚠️ vérifie le slug exact du repo

jobs:
  # --- PROD: push sur main -> gh-pages (racine) ---
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build (prod)
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/
        run: npm run build

      # Déploie UNIQUEMENT dist/ à la racine
      - name: Deploy prod (root)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: false                # ne pas effacer beta/ et pr-*/
          clean-exclude: |
            beta/*

  # --- BETA: push sur Next -> gh-pages/beta ---
  deploy-beta:
    if: github.ref == 'refs/heads/Next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build (beta)
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/beta/
        run: npm run build

      # Déploie UNIQUEMENT dist/ dans beta/
      - name: Deploy beta (/beta)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: beta
          clean: true                 # nettoie beta/ avant d’écrire

  # --- PREVIEW PR vers Next: gh-pages/beta/pr-<num>/ ---
  pr-preview-next:
    if: github.event_name == 'pull_request' && github.base_ref == 'Next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build (PR Next)
        # Marche avec base='./' ou avec VITE_BASE lu par Vite
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/
        run: |
          npm run build
          # garde-fou: on échoue si dist/ est vide / incorrect
          test -f dist/index.html || (echo "dist/index.html manquant" && exit 1)
          echo "--- DIST CONTENT (top) ---"
          find dist -maxdepth 2 -type f | sort | sed 's/^/  /'

      # Déploie UNIQUEMENT dist/ dans le bon sous-dossier, en le nettoyant
      - name: Deploy PR preview (Next)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: beta/pr-${{ github.event.number }}
          clean: true

      - name: Comment preview URL (Next)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            🚀 Préversion déployée :
            https://${{ github.repository_owner }}.github.io/${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/

  # --- PREVIEW PR vers main: même destination /beta/pr-<num>/ ---
  pr-preview-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build (PR main)
        env:
          VITE_BASE: /${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/
        run: |
          npm run build
          test -f dist/index.html || (echo "dist/index.html manquant" && exit 1)
          echo "--- DIST CONTENT (top) ---"
          find dist -maxdepth 2 -type f | sort | sed 's/^/  /'

      - name: Deploy PR preview (main)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: beta/pr-${{ github.event.number }}
          clean: true

      - name: Comment preview URL (main)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            🚀 Préversion déployée :
            https://${{ github.repository_owner }}.github.io/${{ env.REPO_SLUG }}/beta/pr-${{ github.event.number }}/
